schema: tactile_core.v1

# The part of the library that is always delivered.
#
# A principle goes here only if it is true of every task that can read the
# gel and cannot be recovered from the API docstring alone -- the docstring
# says what a field IS, so it cannot also say what a field is NOT.  Six is
# the budget; anything narrower than a principle belongs in the card bank,
# where it only costs words when the reading matches it.
#
# Written as facts about the world, not as procedures: a principle that
# tells the model what is true lets it decide; one that tells it what to do
# is a strategy nobody measured.

principles:
  - id: no-single-reading
    text: >-
      One reading says where the gel is, not what changed; only the difference
      between two does, and only across a recorded command.
  - id: one-channel-one-question
    text: >-
      Each field answers one question -- depth how hard, displacement how far
      the gel moved, coherence whether it moved together, shear which way it
      was dragged, relief what shape the surface is. Ask one a question it
      does not answer and it still answers.
  - id: zero-means-missing
    text: >-
      0.0 is the fallback for a pad that did not report, and it reads like the
      firmest grip; the contact flag says whether a pad is talking. Shear is
      the one field where 0.0 is also an honest reading.
  - id: tactile-cannot-locate
    text: >-
      The gel knows what a touch was like, never where the object is; position
      comes from the arm's own state, and a grasp centred on the gel is a
      guess with extra steps.
  - id: readable-is-not-identity
    text: >-
      A reading is a function of the command as much as of the object -- the
      same object at a different width, depth or pose is a different number.
      Only readings taken the same way compare.
  - id: the-object-is-the-sensor
    text: >-
      The gel deforms what it touches as much as itself: past a certain
      squeeze the reading describes the crush, not the surface.

# Facts that are true on one task and unrecoverable if missed. These stay
# resident because the cost of missing them is a whole run, while the cost
# of carrying them is one line.
task_lines:
  blind_pick_balls:
    - >-
      A gripper close that raises is the ball seated between the pads, not a
      failed grasp: the pads stop on the ball two or more millimetres short of
      the command, and the refusal is the arm reporting that it did.
    - >-
      Ball height is reachable only between x = 0.39 and 0.62. Outside it the
      arm cannot put the pads on a ball's centre: it trades depth for eastward
      travel, so a descent aimed at one ends 11 mm from its goal at 0.38 with
      both gels still on the far plane, and the call comes back a motion
      failure that ends the program.
    - >-
      The pads, not the descent, put the ball in the bowl: at a pad centre
      near 0.11 the ball hangs clear of the rim and inside the mouth, so
      opening the gripper there drops it in. Commanded lower, the descent
      stops a few millimetres short and comes back a motion failure -- a
      placement too, because the pads still hold it over the bowl.
    - >-
      On these balls relief is read with the grip set by opening at 0.6 of
      the travel, 48 mm: that is the seat the field's numbers come from,
      and both pads load there.
  tension_strap:
    - >-
      The strap's load is the difference of the two pads' marker shear -- they
      are mounted mirrored, so a pull runs them opposite ways -- and not their
      depth, which does not move at all.
    - >-
      Close by opening, not by depth: close_gripper(position=0.22) lands the
      pads at 25.70 and 25.25 mm every time and frees the strap, where the
      depth close lands somewhere new on every run and once dragged a pad's
      marker field off its lattice for the rest of the episode.
    - >-
      That grip reads 0.93 N per px of the difference from the close, above
      the first 4.1 px -- the take-up runs 4.1 to 4.5 px from strap to strap
      and reads a little low on both straps measured -- and the first two
      millimetres of pull carry nothing, so a pull that buys no reading has
      not failed. Measure from the close and keep climbing: the
      field does not retrace its path, so descending and taking a fresh zero
      re-zeroes against a state that is not the close -- 0.9 px on a run that
      did, and its second stage landed most of a newton high. Two pads more
      than a third apart in displacement are not a grasp, and closing again
      does not mend one.
    - >-
      The reading climbs by itself while the hand holds still -- most of the
      band over a hold's three seconds, on a load that is flat. Do not
      subtract it by elapsed time and do not watch it during the hold: hold
      the height and the clock.

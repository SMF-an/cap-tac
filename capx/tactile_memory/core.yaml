schema: tactile_core.v1

# The part of the library that is always delivered.
#
# A principle goes here only if it is true of every task that can read the
# gel and cannot be recovered from the API docstring alone -- the docstring
# says what a field IS, so it cannot also say what a field is NOT.  Six is
# the budget; anything narrower than a principle belongs in the card bank,
# where it only costs words when the reading matches it.
#
# Written as facts about the world, not as procedures: a principle that
# tells the model what is true lets it decide; one that tells it what to do
# is a strategy nobody measured.

principles:
  - id: no-single-reading
    text: >-
      Every field here is a state, not an event. One reading says where the
      gel is; only the difference between two readings says what changed, and
      a difference taken across an unrecorded command is not a difference.
  - id: one-channel-one-question
    text: >-
      Each field answers exactly one question -- depth how hard, marker
      displacement how far the gel moved, coherence whether it moved together,
      shear which way it was dragged, relief what shape the surface is. Asking
      a field a question it does not answer still returns a confident number.
  - id: zero-means-missing
    text: >-
      0.0 is the fallback for a pad that did not report, and it sits at the
      wrong end of every scale: a dead pad reads like the firmest grip. The
      contact flag is what says whether a pad is talking. The shear vector is
      the one field where 0.0 is also an honest reading.
  - id: tactile-cannot-locate
    text: >-
      The gel knows whether something touched it and what that touch was
      like; it never knows where the object is. Position comes from the arm's
      own state, and a grasp centred by tactile feedback is a guess with extra
      steps.
  - id: readable-is-not-identity
    text: >-
      A reading is a function of the command that produced it as much as of
      the object: the same object read at a different grip width, depth or
      pose is a different number. Only readings taken the same way compare.
  - id: the-object-is-the-sensor
    text: >-
      The gel measures by deforming what it touches as much as itself. Past a
      certain squeeze the reading describes the crush, not the surface, and a
      measurement that damaged what it measured cannot be repeated.

# Facts that are true on one task and unrecoverable if missed. These stay
# resident because the cost of missing them is a whole run, while the cost
# of carrying them is one line.
task_lines:
  blind_pick_balls:
    - >-
      A gripper close that raises is the ball seated between the pads, not a
      failed grasp: the pads stop on the ball two or more millimetres short of
      the command, and the refusal is the arm reporting that it did.
    - >-
      Ball height is reachable only between x = 0.39 and 0.62. Outside it the
      arm cannot put the pads on a ball's centre: it trades depth for eastward
      travel, so a descent aimed at one ends 11 mm from its goal at 0.38 with
      both gels still on the far plane, and the call comes back a motion
      failure that ends the program.
    - >-
      The pads, not the descent, put the ball in the bowl: at a pad centre
      near 0.11 the ball hangs clear of the rim and inside the mouth, so
      opening the gripper there drops it in. Commanded lower, the descent
      stops a few millimetres short and comes back a motion failure -- a
      placement too, because the pads still hold it over the bowl.
    - >-
      On these balls relief is read with the grip set by opening at 0.6 of
      the travel, 48 mm: that is the seat the field's numbers come from,
      and both pads load there.
  tension_strap:
    - >-
      The strap's load is in the pads' marker shear and not in their depth.
      Pulled, the two pads' shear runs opposite ways -- the pads are mounted
      mirrored -- and the difference between them is the load, while the depth
      readings do not move at all: the tab is dragged along the pads rather
      than pushed into them.
    - >-
      That difference is the load only while both pads are reading the tab.
      A close can drag one pad's whole marker field along with the jaw, and
      that pad then reports the drag: its displacement is several times the
      other's -- 49 px against 8.7 -- and it never comes back during the
      episode. Two pads that disagree that way are not a grasp, and closing
      again in the same place does not mend it: five closes in a row
      reproduced it exactly. A healthy pair reads within about a third of
      each other.
    - >-
      The calibration belongs to the close. Asked for 27.2 mm, the difference
      reads newtons at about one for one -- 0.98 N per px, linear to 0.23 N
      from 0 to 22 N -- and its zero is whatever the pads had made of the gel
      at that moment, 4.6 px of difference on the resting strap. Read the zero
      off the close, where the fixture still holds the strap and the load is
      nothing, and measure every later load from it: it is not a constant, and
      a shallower close moves it by more than a newton.
    - >-
      Close firmly, and check the strap followed. The task frees it only when
      both pads pass 27.7 mm during the close, and a 27.6 mm close has landed
      at 27.80 and left it pinned. A pinned strap buys almost no tension when
      pulled -- 4.9 N after 12 mm where a free one gives 22 -- while the tab
      slides through the gel and reads as a large load that is not there. If
      the first centimetre of pull buys far less than the strap should, it is
      the fixture and not the strap.
    - >-
      The marker difference climbs by itself while the hand holds still: a
      large part of a newton of reading over the three seconds of a hold,
      more than the band, on a load that is flat to a tenth of one. It is a
      settling, not a clock -- it does not accumulate across stages, so a rate
      subtracted by elapsed time lands the next stage high. The consequence is
      the other way round too: the hold is held by the clock and the height,
      and a gauge re-read during it will show the target walking away with
      nothing having moved. Backing off from that reading gives up a load that
      was right.

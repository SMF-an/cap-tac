schema: tactile_keys.v1

# Mined cards: a tactile situation, the line that belongs with it, and the
# evidence it was mined from.  Empty until a run has been mined -- the
# resident text in core.yaml is the whole library until then, and that is a
# supported state, not a broken one.
#
# A card is only reachable by a model that gets another turn: it is printed
# with the reading, and a single-turn program has already been written by
# the time any reading exists.  Knowledge that must change such a program
# belongs in the field's own docstring, which is delivered before it runs.
#
# A card:
#
#   - id: dead-pad-after-close
#     tasks: [blind_pick_balls]      # [] or omitted = any task
#     when: {disp_gap: split, coh: lost}
#     do: >-
#       Read the depth of the pad that is still coherent; the quiet pad's
#       field was dragged with the jaw and its numbers describe the drag.
#     why: Optional provenance for a human. Not delivered.
#     evidence: [blind_pick_balls/seed_3/trial_12]
#     status: observed               # or hypothesis; delivered with the line
#     support:                       # optional; for a human, not delivered
#       n: 12                        # independent episodes, or null
#       conditions: [fixed 48 mm opening, adaptive=false]
#       counterexamples: [blind_pick_balls/seed_8/trial_3]
#       source: build_tactile_bank --root outputs/gpt-6-astra 2026-10-30
#
# `when` must name at least one dimension from
# capx.tactile_memory.signature.BANDS.  `do` is what the model reads when
# the card fires, so it is written action-first and stays under 240 chars.
# A card may not name check_success, a reward or a ground-truth field: the
# line has to survive being handed to a task with no ground truth at all.
#
# `when` says when the card applies; `support` says how firmly the line was
# established.  They are different questions and support never gates
# retrieval: a card with counterexamples still fires, and the contradiction
# is visible in its audit block.  A support block without a `source` is
# refused -- a count nobody can re-check is worse than no count.

cards: []

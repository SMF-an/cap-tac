schema: tactile_keys.v1

# Mined cards: a tactile situation, the line that belongs with it, and the
# evidence it was mined from.  The resident text in core.yaml carries what
# has to be known before the robot moves; a card carries what only matters
# once the reading is in front of the model.
#
# A card:
#
#   - id: dead-pad-after-close
#     tasks: [blind_pick_balls]      # [] or omitted = any task
#     when: {disp_gap: split, coh: lost}
#     do: >-
#       Read the depth of the pad that is still coherent; the quiet pad's
#       field was dragged with the jaw and its numbers describe the drag.
#     why: Optional provenance for a human. Not delivered.
#     evidence: [blind_pick_balls/seed_3/trial_12]
#     status: observed               # or hypothesis
#
# `when` must name at least one dimension from
# capx.tactile_memory.signature.BANDS.  `do` is what the model reads when
# the card fires, so it is written action-first and stays under 240 chars.
# A card may not name check_success, a reward or a ground-truth field: the
# line has to survive being handed to a task with no ground truth at all.

cards:
  - id: relief-under-a-squeeze-is-the-crush
    tasks: [blind_pick_balls]
    when: {relief: rough}
    do: >-
      Compare it against a seated reading: at a fixed 0.6 opening (48 mm)
      smooth reads 0.02-0.04 and dotted 0.09-0.25. Under a depth-servoed
      close the ball is crushed instead, and a smooth rubber one reads 0.15.
    why: >-
      blind_pick_balls seed 8 trial 08: the program closed to a 26.5 mm gel
      depth, read relief 0.152/0.155 at ~120 N a side, called the ball
      dotted and carried a rubber one (the server's physical trace names
      ball 4, rubber, soft).  The task's own calibration seats at a fixed
      48 mm opening, where the same channel separates the surfaces.
    evidence: [blind_pick_balls/seed_8/trial_08]
    status: observed

# UniVTAC: tactile_memory_match, cross-seed trace experiment.
#
# Same task and API as univtac_tactile_memory_match.yaml; the class changes
# what is delivered:
#   * the frozen original-21 library's route minus one skill (6 of its 7):
#     the one-grasp protocol with its 0.50/0.25 closes, the 0.02 texture
#     split, the depth scale, the load channel and the servo caveat;
#   * NOT gel-shear-weight: this task's weight axis is follow/sag, never the
#     pads' shear difference, so the old library's rule contradicts
#     follow-is-signal and is withheld here;
#   * no approach, transport or placement rules -- the old library has none,
#     and that procedure is what the trace is meant to teach.
#
# Run one seed per process, in order, with --trace-mode last:
#   bash scripts/run_trace_chain.sh tactile_memory_match 1 30 <model> 8120 12000
#
# The server must already be running on the same task, and it is a different
# task from grasp_classify -- the 8120 server has to be restarted:
#   bash scripts/launch_univtac_server.sh tactile_memory_match 8120 <gpu> 0

env:
  _target_: capx.envs.tasks.tactile.univtac_tactile_memory_match.UniVTACTactileMemoryMatchTraceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/tactile_memory_match/low_level_tactile_memory_match.yaml
    privileged: false
    apis:
      - UniVTACTactileApi

api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: tactile_memory_match
    port: 8120
    host: 127.0.0.1

record_video: true
# Its own directory: the standard run of this task lives in
# ./outputs/univtac_tactile_memory_match and must not be overwritten.
output_dir: ./outputs/univtac_tactile_memory_match_trace

use_visual_feedback: true
use_img_differencing: true
visual_differencing_model: gpt-6-astra
visual_differencing_model_server_url: http://127.0.0.1:8112/chat/completions

trials: 5
resume_idx: 1
num_workers: 1  # Isaac Sim is not parallel-safe

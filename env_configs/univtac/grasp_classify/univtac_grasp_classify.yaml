# UniVTAC: grasp_classify
# Usage: uv run capx/envs/launch.py --config-path env_configs/univtac/grasp_classify/univtac_grasp_classify.yaml

env:
  _target_: capx.envs.tasks.tactile.univtac_grasp_classify.UniVTACGraspClassifyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/grasp_classify/low_level_grasp_classify.yaml
    privileged: false
    apis:
      - UniVTACTactileApi

api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: grasp_classify
    port: 8120
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/univtac_grasp_classify

use_visual_feedback: true
use_img_differencing: true
visual_differencing_model: gpt-6-astra
visual_differencing_model_server_url: http://127.0.0.1:8112/chat/completions

trials: 5
resume_idx: 1
num_workers: 1  # Isaac Sim is not parallel-safe

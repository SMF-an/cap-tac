# ViTaForge: hardness_classify
# Usage: uv run capx/envs/launch.py --config-path env_configs/univtac/hardness_classify/univtac_hardness_classify.yaml
#
# The server must be started BEFORE this, on the same port:
#   bash scripts/launch_univtac_server.sh hardness_classify 8120 2 0
# (hardness_classify lives in the ViTaForge repo, not UniVTAC — the server
# picks the backing root from its task registry.)

env:
  _target_: capx.envs.tasks.tactile.univtac_hardness_classify.UniVTACHardnessClassifyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/hardness_classify/low_level_hardness_classify.yaml
    privileged: false
    apis:
      - UniVTACTactileApi

# Informational only: UniVTACStubEnv defaults to 127.0.0.1:8120 (override with
# UNIVTAC_SERVER_URL), and the server must already be listening (a free port
# here would spawn a child that fails instantly and stall the run for 120 s).
api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: hardness_classify
    port: 8120
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/univtac_hardness_classify

trials: 40
num_workers: 1  # Isaac Sim is not parallel-safe
resume_idx: 11

use_visual_feedback: true
# Same VLM scene description as the grasp_classify arm: appended right after
# the image sentence.  gpt-6 names are served only by the local proxy.
use_img_differencing: true
visual_differencing_model: gpt-6-astra
visual_differencing_model_server_url: http://127.0.0.1:8112/chat/completions
